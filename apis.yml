name: SODA
description: >-
  SODA Inc. (株式会社SODA) is a Japanese consumer-technology company that operates SNKRDUNK
  (スニーカーダンク / スニダン), one of Japan's largest consumer-to-consumer marketplaces for
  sneakers, trading cards ("トレカ"), apparel, and accessories. The SNKRDUNK app lets users buy
  and sell collectible and secondary-market goods with professional in-house authentication
  (真贋鑑定 by プロ鑑定士) and a full purchase-protection / compensation guarantee, alongside a
  buyback service. SODA is a portfolio company of the SoftBank Vision Fund. As a consumer
  marketplace app, SODA publishes no public developer program or API at this time; this profile
  captures the company's public identity and domain-security posture for the API Evangelist network.
